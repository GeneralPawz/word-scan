name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build helper/ScanHelper.csproj

  addin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: addin
      - run: npm run validate
        working-directory: addin
