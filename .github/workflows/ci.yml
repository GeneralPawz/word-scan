name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  addin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build com-addin/WordScanAddin.csproj -c Release

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile installer with a placeholder payload
        shell: bash
        run: |
          mkdir -p installer/input
          echo "placeholder" > installer/input/WordScanAddin.dll
          ISCC="$(where.exe ISCC.exe 2>/dev/null | head -n1 || true)"
          if [ -z "$ISCC" ]; then
            choco install innosetup -y --no-progress
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          "$ISCC" installer/word-scan.iss
