name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build add-in
        run: >
          dotnet build com-addin/WordScanAddin.csproj -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Build installer
        shell: bash
        run: |
          mkdir -p installer/input
          cp publish/WordScanAddin.dll installer/input/WordScanAddin.dll
          ISCC="$(where.exe ISCC.exe 2>/dev/null | head -n1 || true)"
          if [ -z "$ISCC" ]; then
            choco install innosetup -y --no-progress
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          "$ISCC" installer/word-scan.iss "//DMyAppVersion=${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ steps.version.outputs.tag }} dist/*
          --title "${{ steps.version.outputs.tag }}"
          --generate-notes
